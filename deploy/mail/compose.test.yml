name: tonia-mail-test

# Circuit de recette uniquement. Aucun des deux services n'a de réseau sortant.
services:
  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_LABEL: "TONIA — TEST LOCAL — aucun envoi réel"
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: "7d"
      MP_MAX_MESSAGE_SIZE: "4"
      MP_SMTP_MAX_RECIPIENTS: "1"
      MP_SMTP_ALLOWED_RECIPIENTS: '^[a-zA-Z0-9._+-]+@example\.invalid$$'
      MP_SMTP_DISABLE_RDNS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_ALLOWED_HOSTS: "localhost,127.0.0.1,mailpit"
      MP_QUIET: "true"
    volumes:
      - mailpit_data:/data
    networks:
      mail_test:
        ipv4_address: 172.29.240.3
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  smtp-test:
    image: boky/postfix:v5.1.0@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: example.invalid
      POSTFIX_myhostname: smtp-test.example.invalid
      POSTFIX_mynetworks: "127.0.0.0/8,172.29.240.10/32"
      POSTFIX_smtpd_relay_restrictions: "permit_mynetworks,reject"
      POSTFIX_smtpd_sender_restrictions: "check_sender_access regexp:/etc/postfix/tonia-test-senders,reject"
      POSTFIX_smtpd_recipient_restrictions: "check_recipient_access regexp:/etc/postfix/tonia-test-recipients,reject"
      POSTFIX_smtpd_recipient_limit: "1"
      POSTFIX_smtp_tls_security_level: none
      POSTFIX_smtpd_tls_security_level: none
      POSTFIX_message_size_limit: "4194304"
      POSTFIX_default_process_limit: "10"
      POSTFIX_default_transport_rate_delay: "15s"
      POSTFIX_smtp_destination_concurrency_limit: "1"
      POSTFIX_maximal_queue_lifetime: "1d"
      POSTFIX_bounce_queue_lifetime: "1d"
      RELAYHOST: "[mailpit]:1025"
      ANONYMIZE_EMAILS: paranoid
      # Evite qu'un SyntaxWarning Python amont corrompe le protocole rsyslog.
      PYTHONWARNINGS: "ignore::SyntaxWarning"
      TZ: America/Toronto
    volumes:
      - test_queue:/var/spool/postfix
      - ./test-recipients:/etc/postfix/tonia-test-recipients:ro
      - ./test-senders:/etc/postfix/tonia-test-senders:ro
    networks:
      mail_test:
        ipv4_address: 172.29.240.2
    depends_on:
      - mailpit
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Docker Desktop ne publie pas les ports d'un réseau entièrement internal.
  # Ce proxy ne donne accès qu'à l'interface HTTP; les deux serveurs SMTP restent isolés.
  mail-ui:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8025:8080"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700
      - /data:uid=1000,gid=1000,mode=0700
    networks:
      mail_test:
        ipv4_address: 172.29.240.4
      ui: {}
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 64
    cap_drop: [ALL]
    # Le binaire de l'image Caddy porte cette capability; conserver son bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  ui: {}
  mail_test:
    name: tonia-mail-test
    internal: true
    ipam:
      config:
        - subnet: 172.29.240.0/28

volumes:
  mailpit_data:
  test_queue:
