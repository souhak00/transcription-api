services:
  # Gestionnaire d’identité OIDC local du portail CRM.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-crm
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Keycloak publie ses URL OIDC avec le nom HTTPS du tunnel, tout en
      # continuant d'écouter en HTTP uniquement sur la boucle locale.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-crm-local.json:/opt/keycloak/data/import/realm-crm-local.json:ro
    restart: unless-stopped

  # Base de donnees PostgreSQL locale pour la phase CRM intelligent.
  postgres-crm:
    # Utilise l'image officielle PostgreSQL version 16.
    image: postgres:16
    # Donne un nom stable au conteneur pour le retrouver facilement.
    container_name: postgres-crm
    ports:
      # Expose PostgreSQL sur la machine hote pour n8n local ou les tests psql.
      - "5432:5432"
    environment:
      # Nom de la base creee automatiquement au premier demarrage.
      POSTGRES_DB: transcription_crm
      # Utilisateur applicatif utilise par n8n.
      POSTGRES_USER: transcription_user
      # Mot de passe local de developpement. A changer en production.
      POSTGRES_PASSWORD: transcription_password
    volumes:
      # Conserve les donnees PostgreSQL meme si le conteneur est recrée.
      - postgres_data:/var/lib/postgresql/data
      # Execute le script SQL d'initialisation au premier demarrage du volume.
      - ./database/001_crm_postgresql.sql:/docker-entrypoint-initdb.d/001_crm_postgresql.sql:ro
      # Execute les regles d'acces applicatives au premier demarrage du volume.
      - ./database/002_access_control.sql:/docker-entrypoint-initdb.d/002_access_control.sql:ro
      # Execute la contrainte de format du code metier representant au premier demarrage du volume.
      - ./database/003_representant_business_code.sql:/docker-entrypoint-initdb.d/003_representant_business_code.sql:ro
      - ./database/004_crm_services.sql:/docker-entrypoint-initdb.d/004_crm_services.sql:ro
      - ./database/005_crm_runtime_security.sql:/docker-entrypoint-initdb.d/005_crm_runtime_security.sql:ro
      - ./database/006_derniers_clients.sql:/docker-entrypoint-initdb.d/006_derniers_clients.sql:ro
      - ./database/007_recherche_clients_minimisee.sql:/docker-entrypoint-initdb.d/007_recherche_clients_minimisee.sql:ro
      - ./database/008_code_client_metier.sql:/docker-entrypoint-initdb.d/008_code_client_metier.sql:ro
      - ./database/009_dossier_client_agent.sql:/docker-entrypoint-initdb.d/009_dossier_client_agent.sql:ro
      - ./database/010_clients_documents_manquants.sql:/docker-entrypoint-initdb.d/010_clients_documents_manquants.sql:ro
      - ./database/011_details_hypothecaires.sql:/docker-entrypoint-initdb.d/011_details_hypothecaires.sql:ro
      - ./database/012_consultation_portefeuille.sql:/docker-entrypoint-initdb.d/012_consultation_portefeuille.sql:ro
      - ./database/013_profil_demande_hypothecaire.sql:/docker-entrypoint-initdb.d/013_profil_demande_hypothecaire.sql:ro
      - ./database/014_enregistrement_dossier.sql:/docker-entrypoint-initdb.d/014_enregistrement_dossier.sql:ro
      - ./database/015_relations_dossiers_clients.sql:/docker-entrypoint-initdb.d/015_relations_dossiers_clients.sql:ro
      - ./database/016_parcours_hypothecaire.sql:/docker-entrypoint-initdb.d/016_parcours_hypothecaire.sql:ro
      - ./database/017_agenda_rappels.sql:/docker-entrypoint-initdb.d/017_agenda_rappels.sql:ro
      - ./database/018_suivi_statut_dossier.sql:/docker-entrypoint-initdb.d/018_suivi_statut_dossier.sql:ro
    restart: unless-stopped

  # Service HTTP local appele par curl ou par le noeud HTTP Request de n8n.
  transcription-api:
    # Construit l'image depuis le Dockerfile du dossier courant.
    build:
      # Le contexte de build est le dossier courant, qui contient Dockerfile, src et scripts.
      context: .
      # Les arguments ci-dessous sont transmis au Dockerfile pendant la construction.
      args:
        # Utilise le grand modele francais Vosk pour ameliorer la precision de transcription.
        # Le petit modele est plus rapide, mais il manque davantage de mots sur les audios reels.
        VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-fr-0.22.zip
    container_name: transcription-api
    ports:
      # Rend le port de l'API accessible sur la machine hote.
      - "3000:3000"
    environment:
      # Configure le serveur et le moteur Vosk integre dans l'image.
      HOST: 0.0.0.0
      PORT: 3000
      TRANSCRIBER_COMMAND: python3
      TRANSCRIBER_ARGS: "scripts/vosk_transcribe.py --model /opt/vosk-model --input {input} --output {output} {diarizeArgs} {diarizationModelArgs}"
      DIARIZATION_MODEL: pyannote/speaker-diarization-3.1
      FFMPEG_AUDIO_FILTERS: highpass=f=80,lowpass=f=7800,loudnorm
      # HUGGINGFACE_TOKEN est requis si le modele pyannote choisi est protege.
      # HUGGINGFACE_TOKEN: hf_xxx
      MAX_UPLOAD_BODY_MB: 512
      # L API relaie les messages Web vers n8n; le navigateur ne connait pas cette URL.
      N8N_AGENT_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/agent-chat
      N8N_RECENT_CLIENTS_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/clients-recents
      N8N_MISSING_DOCUMENTS_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/documents-manquants
      N8N_CLIENT_DOSSIER_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/dossier-client
      N8N_DOSSIER_WRITE_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/enregistrer-dossier
      N8N_PORTFOLIO_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/portefeuille
      N8N_CALENDAR_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/agenda
      N8N_CALENDAR_WRITE_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/agenda/evenements
      N8N_CALENDAR_UPDATE_WEBHOOK_URL: http://host.docker.internal:5678/webhook/crm/agenda/evenements/modifier
      AGENT_TIMEOUT_MS: 120000
      # L’API valide les jetons Keycloak et extrait le representant_id signé.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/crm-local}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/crm-local/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: crm-api
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: crm-local
      KEYCLOAK_CLIENT_ID: crm-web
      # Compte technique confidentiel, limité à la gestion des utilisateurs Keycloak.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    volumes:
      # Conserve les transcriptions sur le disque meme si le conteneur est supprime.
      - ./outputs:/app/outputs
    restart: unless-stopped

volumes:
  # Volume Docker persistant qui stocke physiquement les donnees PostgreSQL.
  postgres_data:
  # Persiste la configuration et les utilisateurs du gestionnaire d’identité local.
  keycloak_data:
